name: Frontend CI

on:
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml

permissions:
  contents: read

jobs:
  frontend:
    uses: sneat-co/cicd/.github/workflows/nx-ci.yml@main
    with:
      working-directory: frontend
      node-version: "22"
      targets: "lint build"
      coverage-command: pnpm exec nx run ext-docus-contract:test --coverage
      coverage-path: coverage
      minimum-coverage: 100
      coverage-artifact-name: ext-docus-contract-coverage
